version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      development-dependencies:
        patterns: ['*']
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(actions)'
