name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.SITE_LAUNCH_APPROVED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Verify Pages matches the central production URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run pages-preflight -- --repo "$GITHUB_REPOSITORY" --require-configured
      - name: Check and create clean production output
        run: npm run check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public
          include-hidden-files: false
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Verify HTTPS and ownership state
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run pages-preflight -- --repo "$GITHUB_REPOSITORY" --require-ready
      - name: Inspect live HTTPS release
        env:
          DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          base_url="$(node scripts/site.mjs base-url)"
          test "${DEPLOYED_URL%/}/" = "$base_url"
          npm run smoke -- "$base_url"
