name: Link health
on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: link-health
  cancel-in-progress: true
jobs:
  report:
    if: vars.LINK_HEALTH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - run: npm run build
      - name: Report external links without treating timeouts as outages
        run: node .github/scripts/link-health.mjs
