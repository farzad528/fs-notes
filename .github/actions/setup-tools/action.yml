name: Set up pinned build tools
description: Install Node and checksum-verified standard Hugo on Ubuntu x64
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24.19.0
        package-manager-cache: false
    - name: Install Hugo 0.168.0
      shell: bash
      env:
        HUGO_VERSION: 0.168.0
        HUGO_SHA256: fada83ad56bb27ed4cb7dd81590303bdac16140f944ac4e66fc248117e2d5594
      run: |
        set -euo pipefail
        archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
        curl --fail --silent --show-error --location --retry 3 \
          "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}" \
          --output "${RUNNER_TEMP}/${archive}"
        printf '%s  %s\n' "$HUGO_SHA256" "${RUNNER_TEMP}/${archive}" | sha256sum --check
        mkdir -p "${RUNNER_TEMP}/fs-notes-hugo"
        tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/fs-notes-hugo" hugo
        echo "${RUNNER_TEMP}/fs-notes-hugo" >> "$GITHUB_PATH"
    - name: Install locked development dependencies
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund
