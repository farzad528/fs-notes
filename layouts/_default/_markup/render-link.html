{{ $url := .Destination }}
{{ if not (urls.Parse $url).IsAbs }}
  {{ if hasPrefix $url "/" }}
    {{ $url = strings.TrimPrefix "/" $url | absURL }}
  {{ else }}
    {{ $url = printf "%s%s" .Page.Permalink $url }}
  {{ end }}
{{ end }}
<a href="{{ $url | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}>{{ .Text }}</a>
